name: Pull CBBD Data

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year (2025 => 2024-2025)"
        required: true
        default: "2025"
      season_type:
        description: "regular, postseason, or both"
        required: true
        default: "both"
      datasets:
        description: "lineups, plays, or both"
        required: true
        default: "both"
      include_player_shooting:
        description: "also pull player shooting (true/false)"
        required: true
        default: "false"
      cache_mode:
        description: "none, readwrite, readonly, refresh"
        required: true
        default: "readwrite"
      teams_csv:
        description: "Path to teams CSV in repo"
        required: true
        default: "2025_team_results (1).csv"
      out_root:
        description: "Output folder in repo"
        required: true
        default: "cbbd_seasons"
      max_requests:
        description: "Safety cap for API requests"
        required: true
        default: "3000"
      team_start:
        description: "1-based matched team start index"
        required: true
        default: "1"
      team_end:
        description: "1-based matched team end index (0 = all)"
        required: true
        default: "0"
      chunk_tag:
        description: "Chunk suffix for output files (e.g. chunk001_120)"
        required: false
        default: ""
      merge_chunks:
        description: "Merge chunk CSVs into one file at end (true/false)"
        required: true
        default: "false"
      merge_only:
        description: "Skip pulling and only merge existing chunk CSVs (true/false)"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore API cache
        if: ${{ inputs.cache_mode != 'none' }}
        uses: actions/cache@v4
        with:
          path: /tmp/cbbd_http_cache
          key: ${{ runner.os }}-cbbd-http-${{ inputs.year }}-${{ inputs.season_type }}-${{ inputs.datasets }}-${{ inputs.team_start }}-${{ inputs.team_end }}-v1
          restore-keys: |
            ${{ runner.os }}-cbbd-http-${{ inputs.year }}-${{ inputs.season_type }}-${{ inputs.datasets }}-
            ${{ runner.os }}-cbbd-http-${{ inputs.year }}-${{ inputs.season_type }}-
            ${{ runner.os }}-cbbd-http-${{ inputs.year }}-

      - name: Pull data
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: |
          SHOOTING_FLAG=""
          if [ "${{ inputs.include_player_shooting }}" = "true" ]; then
            SHOOTING_FLAG="--include-player-shooting"
          fi

          MERGE_CHUNKS_FLAG=""
          if [ "${{ inputs.merge_chunks }}" = "true" ]; then
            MERGE_CHUNKS_FLAG="--merge-chunks"
          fi

          MERGE_ONLY_FLAG=""
          if [ "${{ inputs.merge_only }}" = "true" ]; then
            MERGE_ONLY_FLAG="--merge-only"
          fi

          python pull_cbbd_lineups_plays_only.py \
            --year "${{ inputs.year }}" \
            --season-type "${{ inputs.season_type }}" \
            --datasets "${{ inputs.datasets }}" \
            --teams-csv "${{ inputs.teams_csv }}" \
            --out-root "${{ inputs.out_root }}" \
            --max-requests "${{ inputs.max_requests }}" \
            --cache-mode "${{ inputs.cache_mode }}" \
            --cache-dir "/tmp/cbbd_http_cache" \
            --team-start "${{ inputs.team_start }}" \
            --team-end "${{ inputs.team_end }}" \
            --chunk-tag "${{ inputs.chunk_tag }}" \
            $SHOOTING_FLAG \
            $MERGE_CHUNKS_FLAG \
            $MERGE_ONLY_FLAG

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.out_root }}"
          if git diff --staged --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update CBBD outputs for ${{ inputs.year }} (${{ inputs.season_type }}) [${{ inputs.team_start }}-${{ inputs.team_end }}] ${{ inputs.chunk_tag }}"
            git push
          fi
